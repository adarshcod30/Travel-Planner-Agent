name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra mcp

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Blocking. It was advisory while 35 errors stood; they are gone, and an
      # advisory type check on a clean tree is just a slower way of not having
      # one — the next regression would land green.
      - name: Type check
        run: uv run mypy src

      # No .env and no credentials on purpose: the suite must be hermetic. The
      # Bedrock model IDs have defaults precisely so this passes here, rather
      # than only on a developer machine that happens to be configured.
      # Excludes `live` (real Bedrock, costs money) and `integration`
      # (needs Postgres and a running Aegra).
      - name: Tests
        run: uv run pytest -m "not live and not integration"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings 0

      # The build is the real check: it catches server/client boundary mistakes
      # and bad route handler signatures that tsc alone does not.
      - name: Build
        run: npm run build
        env:
          AEGRA_URL: http://127.0.0.1:2026

  # The serving layer. Everything in the `backend` job runs the graphs directly
  # with an in-memory checkpointer, which is what makes it fast and hermetic —
  # and also means it proves nothing about Aegra. This job boots a real server
  # against a real Postgres and exercises the parts only a server has: the
  # manifest wiring, assistant registration at derived ids, the checkpointer
  # Aegra injects into graphs that never construct one, and the custom routes
  # mounted on the same port.
  #
  # No AWS credentials here, so no graph is ever run — the `live` mark covers
  # the one test that would, and it stays excluded.
  serving:
    name: Serving layer
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: travel_planner
          POSTGRES_PASSWORD: travel_planner
          POSTGRES_DB: travel_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://travel_planner:travel_planner@localhost:5432/travel_planner
      AEGRA_URL: http://127.0.0.1:2026
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra mcp

      - name: Apply migrations
        run: uv run aegra db upgrade

      - name: Start Aegra
        run: |
          uv run aegra serve --host 127.0.0.1 --port 2026 > aegra.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -H "Authorization: Bearer local-dev" http://127.0.0.1:2026/info >/dev/null 2>&1; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not start"; cat aegra.log; exit 1

      - name: Integration tests
        run: uv run pytest -m "integration and not live" -q

      # The log is the only way to see why a boot failed on someone else's
      # runner, so keep it when the job goes red.
      - name: Server log
        if: failure()
        run: cat aegra.log
