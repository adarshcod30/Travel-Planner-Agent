name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra mcp

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src
        continue-on-error: true

      # Excludes the `live` marker (real Bedrock calls, costs money and needs
      # credentials) and `integration` (needs Postgres and a running Aegra).
      - name: Unit tests
        run: uv run pytest -m "not live and not integration"
