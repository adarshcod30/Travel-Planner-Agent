[project]
name = "travel-mcp"
version = "0.1.0"
description = "MCP server exposing travel reference tools: climate, currency, visas, flight costs, destination search"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adarsh Dwivedi" }]

dependencies = ["fastmcp>=3.0.0", "httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
travel-mcp = "travel_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_mcp"]
