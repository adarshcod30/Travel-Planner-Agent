[project]
name = "travel-planner-agent"
version = "0.1.0"
description = "Five generations of a multi-agent travel planner served concurrently by Aegra on AWS Bedrock"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Adarsh Dwivedi" }]
keywords = ["langgraph", "aegra", "agent-protocol", "bedrock", "mcp", "multi-agent"]

dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # Bedrock via the Converse API
    "langchain-aws>=0.2.0",
    "boto3>=1.34.0",
    # MCP tooling (v5)
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    # Config, validation, logging
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# The Aegra server itself. Kept optional so the graphs can be imported and
# unit-tested without pulling in the server and its Postgres driver.
server = [
    "aegra-api>=0.10.4",
    "aegra-cli>=0.10.0",
    "langgraph-sdk>=0.1.0",
]
# The custom travel-mcp server, runnable standalone.
mcp = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_planner"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default arg — normal for Depends()/Field()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: hits real AWS Bedrock — costs money, needs credentials",
    "integration: needs a running Aegra server or Postgres",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
